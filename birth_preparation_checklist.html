<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>출산 준비물 체크리스트</title>
<style>
  :root{--blue:#5378b8;--lav:#eef3ff;--ink:#30333a;--muted:#6b7280;--line:#dde3ee;--green:#2f7d65;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:#f7f9fd;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:1050px;margin:auto;padding:28px 18px 60px}header{background:linear-gradient(135deg,#5c82c5,#8b69b4);color:#fff;border-radius:24px;padding:30px;box-shadow:0 14px 35px #536aa32e}h1{margin:0 0 8px;font-size:clamp(25px,5vw,38px)}header p{margin:0;opacity:.93}.grid{display:grid;grid-template-columns:340px 1fr;gap:20px;margin-top:20px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 7px 22px #425a8b0d}h2{font-size:20px;margin:0 0 18px}.field{margin-bottom:14px}label{display:block;font-weight:700;font-size:14px;margin-bottom:7px}input,select,textarea{width:100%;padding:12px 13px;border:1px solid #cfd7e6;border-radius:11px;font:inherit;background:#fff}textarea{min-height:75px;resize:vertical}input:focus,select:focus,textarea:focus{outline:3px solid #dbe6ff;border-color:var(--blue)}.row{display:grid;grid-template-columns:1fr 90px;gap:10px}.btn{border:0;border-radius:11px;padding:11px 15px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#edf1f8;color:#40516d}.danger{background:#fff0ee;color:var(--red)}.actions{display:flex;gap:8px;flex-wrap:wrap}.progress-box{background:var(--lav);border-radius:16px;padding:17px;margin-bottom:17px}.progress-text{display:flex;justify-content:space-between;font-weight:800;margin-bottom:9px}.track{height:12px;border-radius:99px;background:#d8e1f2;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--blue),#48a281);transition:.25s}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.filter{border:1px solid var(--line);background:#fff;color:#4e596b;border-radius:99px;padding:8px 12px;cursor:pointer}.filter.active{background:var(--blue);color:#fff;border-color:var(--blue)}.item{display:grid;grid-template-columns:auto 1fr auto;gap:13px;align-items:start;border-bottom:1px solid var(--line);padding:14px 4px}.item:last-child{border:0}.check{width:23px;height:23px;accent-color:var(--green);margin-top:2px}.item.done .name{text-decoration:line-through;color:#9298a4}.name{font-weight:800}.meta,.memo{font-size:13px;color:var(--muted);margin-top:4px}.badge{display:inline-block;background:var(--lav);color:#4a6391;border-radius:7px;padding:3px 7px;margin-right:6px}.small{padding:7px 10px;font-size:12px}.empty{text-align:center;color:var(--muted);padding:35px}.notice{font-size:13px;color:var(--muted);margin-top:17px;line-height:1.6}@media(max-width:760px){.grid{grid-template-columns:1fr}.item{grid-template-columns:auto 1fr}.item>.actions{grid-column:2}.row{grid-template-columns:1fr 90px}}@media print{header,.form-card,.filters,.item .actions,.bottom-actions{display:none}.grid{display:block}.card{box-shadow:none;border:0}.wrap{padding:0}}
</style></head><body><main class="wrap"><header><h1>🍼 출산 준비물 체크리스트</h1><p>필요한 물품을 빠짐없이 준비하고 완료율을 한눈에 확인하세요.</p></header><section class="grid">
<form class="card form-card" id="itemForm"><h2 id="formTitle">준비물 추가</h2><div class="field"><label for="category">분류</label><select id="category"><option>병원 가방</option><option>산모용품</option><option>아기용품</option><option>집 준비</option><option>서류·기타</option></select></div><div class="row"><div class="field"><label for="name">준비물 이름 *</label><input id="name" maxlength="50" required placeholder="예: 배냇저고리"></div><div class="field"><label for="quantity">수량</label><input id="quantity" type="number" min="1" max="99" value="1"></div></div><div class="field"><label for="memo">메모</label><textarea id="memo" maxlength="200" placeholder="브랜드, 구입처, 챙길 장소 등"></textarea></div><div class="actions"><button class="btn primary" type="submit" id="saveBtn">추가하기</button><button class="btn secondary" type="button" id="cancelBtn" hidden>수정 취소</button></div><p class="notice">입력한 체크리스트는 현재 브라우저에 자동 저장됩니다.</p></form>
<section class="card"><h2>나의 준비 현황</h2><div class="progress-box"><div class="progress-text"><span id="progressLabel">0 / 0개 준비</span><span id="percent">0%</span></div><div class="track"><div class="bar" id="bar"></div></div></div><div class="filters" id="filters"><button class="filter active" data-filter="전체">전체</button><button class="filter" data-filter="미완료">미완료</button><button class="filter" data-filter="완료">완료</button><button class="filter" data-filter="병원 가방">병원 가방</button><button class="filter" data-filter="산모용품">산모용품</button><button class="filter" data-filter="아기용품">아기용품</button></div><div id="list"></div><div class="actions bottom-actions" style="margin-top:18px"><button class="btn secondary" onclick="window.print()">목록 인쇄</button><button class="btn danger" id="resetBtn">기본 목록으로 초기화</button></div></section></section></main>
<script>
const KEY='birthChecklist_v1';let editingId=null,filter='전체';const $=id=>document.getElementById(id);const defaults=[['병원 가방','산모수첩',1],['병원 가방','신분증',1],['병원 가방','세면도구',1],['병원 가방','충전기',1],['산모용품','수유브라',2],['산모용품','산모패드',1],['산모용품','편한 옷',2],['아기용품','배냇저고리',2],['아기용품','속싸개',2],['아기용품','기저귀',1],['아기용품','물티슈',1],['집 준비','아기 침구',1],['집 준비','카시트',1],['서류·기타','출생신고 준비 확인',1]].map((x,i)=>({id:'d'+i,category:x[0],name:x[1],quantity:x[2],memo:'',done:false}));
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const load=()=>{try{const v=JSON.parse(localStorage.getItem(KEY));return Array.isArray(v)?v:defaults}catch{return defaults}};const save=v=>localStorage.setItem(KEY,JSON.stringify(v));
function resetForm(){editingId=null;$('itemForm').reset();$('quantity').value=1;$('formTitle').textContent='준비물 추가';$('saveBtn').textContent='추가하기';$('cancelBtn').hidden=true}
function render(){const all=load(),done=all.filter(x=>x.done).length,p=all.length?Math.round(done/all.length*100):0;$('progressLabel').textContent=`${done} / ${all.length}개 준비`;$('percent').textContent=p+'%';$('bar').style.width=p+'%';const shown=all.filter(x=>filter==='전체'||filter==='완료'&&x.done||filter==='미완료'&&!x.done||x.category===filter);$('list').innerHTML=shown.length?shown.map(x=>`<article class="item ${x.done?'done':''}"><input class="check" type="checkbox" ${x.done?'checked':''} aria-label="${esc(x.name)} 준비 완료" onchange="toggle('${x.id}')"><div><div class="name">${esc(x.name)}</div><div class="meta"><span class="badge">${esc(x.category)}</span>수량 ${x.quantity}</div>${x.memo?`<div class="memo">${esc(x.memo)}</div>`:''}</div><div class="actions"><button class="btn secondary small" onclick="editItem('${x.id}')">수정</button><button class="btn danger small" onclick="removeItem('${x.id}')">삭제</button></div></article>`).join(''):'<div class="empty">조건에 맞는 준비물이 없습니다.</div>'}
$('itemForm').addEventListener('submit',e=>{e.preventDefault();const item={id:editingId||String(Date.now()),category:$('category').value,name:$('name').value.trim(),quantity:Number($('quantity').value)||1,memo:$('memo').value.trim(),done:false};let a=load();if(editingId){const old=a.find(x=>x.id===editingId);item.done=old?.done||false;a=a.map(x=>x.id===editingId?item:x)}else a.push(item);save(a);resetForm();render()});
window.toggle=id=>{save(load().map(x=>x.id===id?{...x,done:!x.done}:x));render()};window.removeItem=id=>{if(confirm('이 준비물을 삭제할까요?')){save(load().filter(x=>x.id!==id));render()}};window.editItem=id=>{const x=load().find(x=>x.id===id);if(!x)return;editingId=id;$('category').value=x.category;$('name').value=x.name;$('quantity').value=x.quantity;$('memo').value=x.memo;$('formTitle').textContent='준비물 수정';$('saveBtn').textContent='수정 저장';$('cancelBtn').hidden=false;scrollTo({top:0,behavior:'smooth'})};
$('cancelBtn').onclick=resetForm;$('resetBtn').onclick=()=>{if(confirm('현재 목록을 지우고 기본 준비물로 되돌릴까요?')){save(defaults);resetForm();render()}};$('filters').onclick=e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()};if(!localStorage.getItem(KEY))save(defaults);render();
</script></body></html>
