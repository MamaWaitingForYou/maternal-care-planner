<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>임산부 일정·출산 준비 관리</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#fff7fb;color:#3c333a}.wrap{max-width:900px;margin:auto;padding:35px 18px 70px}header{text-align:center;padding:45px 20px}h1{font-size:clamp(28px,6vw,44px);margin:0 0 12px;color:#a34476}header p{color:#746771;line-height:1.7}.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#fff;border:1px solid #eadce4;border-radius:22px;padding:28px;box-shadow:0 12px 30px #74395514}.icon{font-size:42px}.card h2{font-size:22px;margin:15px 0 10px}.card p{color:#70666d;line-height:1.7;min-height:82px}.btn{display:inline-block;text-decoration:none;background:#a34476;color:#fff;border-radius:12px;padding:13px 18px;font-weight:800}.card:nth-child(2) .btn{background:#5b76af}.notice{margin-top:25px;background:#fff1d8;color:#6b511f;border-radius:15px;padding:16px;line-height:1.6;font-size:13px}@media(max-width:650px){.cards{grid-template-columns:1fr}.card p{min-height:auto}header{padding:25px 10px}}
  </style>
</head>
<body><main class="wrap"><header><h1>🤰 임산부 관리 프로그램</h1><p>병원 방문 일정과 출산 준비물을 한곳에서 편리하게 관리하세요.</p></header><section class="cards"><article class="card"><div class="icon">🏥</div><h2>병원 방문 일정 관리</h2><p>검진 날짜와 병원 정보를 등록하고 다음 방문일까지 남은 날짜를 확인할 수 있습니다.</p><a class="btn" href="hospital_visit_schedule.html">일정 관리 실행하기</a></article><article class="card"><div class="icon">🍼</div><h2>출산 준비물 체크리스트</h2><p>산모와 아기에게 필요한 물품을 분류별로 기록하고 준비 완료율을 확인할 수 있습니다.</p><a class="btn" href="birth_preparation_checklist.html">체크리스트 실행하기</a></article></section><div class="notice"><b>안내:</b> 이 프로그램은 일정·준비물 관리용이며 의료진의 진료를 대신하지 않습니다. 입력 내용은 현재 브라우저에만 저장됩니다.</div></main></body>
</html>
