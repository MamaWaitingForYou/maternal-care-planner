<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>임산부 통합 관리 프로그램</title>
  <style>
    :root{--pink:#ad4c79;--ink:#332d31;--muted:#746a71;--line:#eadde4;--bg:#fff8fb}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
    header{background:linear-gradient(135deg,#b54f7f,#726db0);color:#fff;padding:27px 18px;text-align:center}
    h1{margin:0 0 7px;font-size:clamp(24px,5vw,37px)}header p{margin:0;opacity:.92}
    .tabs-wrap{position:sticky;top:0;z-index:5;background:#ffffffef;border-bottom:1px solid var(--line);backdrop-filter:blur(9px)}
    .tabs{max-width:1150px;margin:auto;padding:12px;display:flex;gap:8px;overflow-x:auto}
    .tab{flex:1;min-width:175px;border:1px solid var(--line);background:#fff;color:#51454c;border-radius:11px;padding:11px 12px;font:inherit;font-weight:800;cursor:pointer;white-space:nowrap}
    .tab.active{background:var(--pink);border-color:var(--pink);color:#fff}
    .stage{max-width:1200px;margin:18px auto;padding:0 14px}.frame-box{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 10px 28px #75385213}
    iframe{display:block;width:100%;height:850px;border:0;background:#fff}.note{max-width:1150px;margin:0 auto 25px;padding:0 15px;color:var(--muted);font-size:13px;line-height:1.6}
    @media(max-width:700px){header{padding:22px 14px}.stage{margin-top:10px;padding:0 7px}.frame-box{border-radius:12px}iframe{height:1000px}}
  </style>
</head>
<body>
  <header><h1>🤰 임산부 통합 관리 프로그램</h1><p>원하는 기능을 선택하면 아래 화면에서 바로 실행됩니다.</p></header>
  <nav class="tabs-wrap" aria-label="프로그램 선택"><div class="tabs">
    <button class="tab active" data-file="hospital_visit_schedule.html">🏥 병원 일정</button>
    <button class="tab" data-file="birth_preparation_checklist.html">🍼 출산 준비물</button>
    <button class="tab" data-file="medication_schedule.html">💊 복약·영양제</button>
    <button class="tab" data-file="prenatal_test_checklist.html">🩺 산전검사</button>
    <button class="tab" data-file="birth_childcare_cost_calculator.html">🧸 예상비용</button>
  </div></nav>
  <main class="stage"><div class="frame-box"><iframe id="programFrame" title="선택한 임산부 관리 프로그램" src="hospital_visit_schedule.html"></iframe></div></main>
  <p class="note"><b>안내:</b> 입력한 내용은 현재 브라우저에 저장됩니다. 이 프로그램은 일정·기록·예산 관리를 위한 학습용이며 의료진의 진단·진료·처방을 대신하지 않습니다.</p>
  <script>
    const frame=document.getElementById('programFrame');
    document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>{
      document.querySelectorAll('.tab').forEach(item=>item.classList.remove('active'));
      button.classList.add('active'); frame.src=button.dataset.file;
      window.scrollTo({top:document.querySelector('.tabs-wrap').offsetTop,behavior:'smooth'});
    }));
  </script>
</body></html>
