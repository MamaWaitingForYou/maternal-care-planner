<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>산전검사 일정 체크리스트</title><style>
:root{--p:#3d8890;--bg:#f4fbfb;--line:#d7e9e9;--muted:#667477}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#2c3738;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:980px;margin:auto;padding:26px 16px 60px}header{background:linear-gradient(135deg,#3c9098,#5b7ab1);color:white;padding:28px;border-radius:22px}h1{margin:0 0 8px;font-size:clamp(25px,5vw,37px)}header p{margin:0}.grid{display:grid;grid-template-columns:350px 1fr;gap:18px;margin-top:18px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:21px;box-shadow:0 8px 22px #315b6610}h2{margin:0 0 16px;font-size:20px}.field{margin-bottom:13px}label{display:block;font-size:14px;font-weight:800;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid #c7dddd;border-radius:10px;padding:11px;font:inherit}textarea{min-height:70px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:10px;padding:10px 13px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--p);color:white}.secondary{background:#e8f2f2;color:#31595d}.danger{background:#fff0ee;color:#a72921}.actions{display:flex;gap:7px;flex-wrap:wrap}.item{border:1px solid var(--line);border-radius:13px;padding:14px;margin-top:9px}.item.done{opacity:.6;background:#f4f5f5}.item.done h3{text-decoration:line-through}.top{display:flex;justify-content:space-between;gap:12px}.item h3{margin:0 0 5px}.dday{font-weight:900;color:var(--p);white-space:nowrap}.meta,.memo{font-size:13px;color:var(--muted);margin-top:5px}.small{font-size:12px;padding:7px 9px}.empty{text-align:center;color:var(--muted);padding:35px}.notice{font-size:13px;line-height:1.6;color:#5b6567;margin-top:18px}@media(max-width:720px){.grid{grid-template-columns:1fr}.top{display:block}.dday{display:block;margin-top:6px}}
</style></head><body><main class="wrap"><header><h1>🩺 산전검사 일정 체크리스트</h1><p>검사 예정일과 임신 주수를 등록하여 중요한 검사를 관리하세요.</p></header><section class="grid"><form class="card" id="form"><h2 id="formTitle">검사 일정 등록</h2><div class="field"><label for="name">검사명 *</label><input id="name" required maxlength="60" placeholder="예: 임신성 당뇨검사"></div><div class="row"><div class="field"><label for="date">예정일 *</label><input id="date" type="date" required></div><div class="field"><label for="week">임신 주수</label><input id="week" type="number" min="1" max="42" placeholder="24"></div></div><div class="field"><label for="hospital">병원명</label><input id="hospital" maxlength="60"></div><div class="field"><label for="memo">준비사항·메모</label><textarea id="memo" maxlength="250" placeholder="금식 여부 등 병원 안내를 적으세요."></textarea></div><div class="actions"><button class="btn primary" type="submit" id="saveBtn">검사 저장</button><button class="btn secondary" type="button" id="cancel" hidden>수정 취소</button></div></form><section class="card"><h2>검사 목록</h2><div id="list"></div></section></section><p class="notice">검사 종류와 시기는 개인의 건강 상태에 따라 달라질 수 있으므로 의료진이 안내한 일정을 우선으로 따르세요.</p></main><script>
const KEY='prenatalTests_v1',$=x=>document.getElementById(x);let editId=null;const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch{return[]}},save=a=>localStorage.setItem(KEY,JSON.stringify(a)),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function days(s){let n=new Date();n.setHours(0,0,0,0);const [y,m,d]=s.split('-').map(Number);return Math.round((new Date(y,m-1,d)-n)/86400000)}function reset(){editId=null;$('form').reset();$('formTitle').textContent='검사 일정 등록';$('saveBtn').textContent='검사 저장';$('cancel').hidden=true}function render(){const a=load().sort((x,y)=>x.date.localeCompare(y.date));$('list').innerHTML=a.length?a.map(x=>{const d=days(x.date),dd=d===0?'오늘':d>0?`D-${d}`:`${Math.abs(d)}일 전`;return `<article class="item ${x.done?'done':''}"><div class="top"><div><h3>${esc(x.name)}</h3><div class="meta">${x.week?`임신 ${x.week}주 · `:''}${esc(x.hospital||'병원 미입력')} · ${esc(x.date)}</div></div><span class="dday">${dd}</span></div>${x.memo?`<div class="memo">${esc(x.memo)}</div>`:''}<div class="actions" style="margin-top:11px"><button class="btn small ${x.done?'secondary':'primary'}" onclick="toggle('${x.id}')">${x.done?'완료 취소':'검사 완료'}</button><button class="btn small secondary" onclick="editItem('${x.id}')">수정</button><button class="btn small danger" onclick="removeItem('${x.id}')">삭제</button></div></article>`}).join(''):'<div class="empty">등록된 산전검사가 없습니다.</div>'}$('form').onsubmit=e=>{e.preventDefault();const n={id:editId||String(Date.now()),name:$('name').value.trim(),date:$('date').value,week:$('week').value,hospital:$('hospital').value.trim(),memo:$('memo').value.trim(),done:false};let a=load();if(editId){n.done=a.find(x=>x.id===editId)?.done||false;a=a.map(x=>x.id===editId?n:x)}else a.push(n);save(a);reset();render()};window.toggle=id=>{save(load().map(x=>x.id===id?{...x,done:!x.done}:x));render()};window.removeItem=id=>{if(confirm('삭제할까요?')){save(load().filter(x=>x.id!==id));render()}};window.editItem=id=>{const x=load().find(x=>x.id===id);editId=id;['name','date','week','hospital','memo'].forEach(k=>$(k).value=x[k]);$('formTitle').textContent='검사 일정 수정';$('saveBtn').textContent='수정 저장';$('cancel').hidden=false};$('cancel').onclick=reset;render();
</script></body></html>
