<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>임산부 복약·영양제 일정 관리</title><style>
:root{--p:#8d579d;--bg:#faf6fc;--line:#eadfed;--muted:#716879;--ok:#28775d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#352e39;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:960px;margin:auto;padding:26px 16px 60px}header{padding:28px;border-radius:22px;background:linear-gradient(135deg,#9b5fa6,#c06f91);color:white}h1{margin:0 0 8px;font-size:clamp(25px,5vw,37px)}header p{margin:0}.grid{display:grid;grid-template-columns:350px 1fr;gap:18px;margin-top:18px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:21px;box-shadow:0 8px 22px #62466812}h2{margin:0 0 16px;font-size:20px}.field{margin-bottom:13px}label{display:block;font-size:14px;font-weight:800;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid #d9cadf;border-radius:10px;padding:11px;font:inherit}textarea{min-height:70px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 13px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#f0e9f2;color:#563f5e}.danger{background:#fff0ee;color:#a72921}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.stat{background:#f6eef8;border-radius:13px;padding:13px;text-align:center}.stat b{display:block;font-size:23px;color:var(--p)}.item{border:1px solid var(--line);border-radius:13px;padding:14px;margin-top:9px}.item.done{opacity:.62;background:#f5f5f5}.item.done h3{text-decoration:line-through}.top{display:flex;justify-content:space-between;gap:10px}.item h3{margin:0 0 5px}.time{font-weight:900;color:var(--p)}.meta,.memo{font-size:13px;color:var(--muted);margin-top:5px}.small{font-size:12px;padding:7px 9px}.empty{text-align:center;color:var(--muted);padding:34px 5px}.notice{font-size:13px;line-height:1.6;background:#fff4dc;color:#6e531d;border-radius:13px;padding:14px;margin-top:18px}@media(max-width:720px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><header><h1>💊 복약·영양제 일정 관리</h1><p>오늘 복용할 약과 영양제를 기록하고 완료 여부를 확인하세요.</p></header><section class="grid"><form class="card" id="form"><h2 id="formTitle">복용 일정 등록</h2><div class="field"><label for="name">약·영양제명 *</label><input id="name" required maxlength="50" placeholder="예: 엽산"></div><div class="row"><div class="field"><label for="amount">복용량</label><input id="amount" maxlength="30" placeholder="예: 1정"></div><div class="field"><label for="time">복용 시간 *</label><input id="time" type="time" required></div></div><div class="field"><label for="frequency">복용 시점</label><select id="frequency"><option>식전</option><option>식후</option><option>취침 전</option><option>시간 관계없음</option><option>기타</option></select></div><div class="field"><label for="memo">메모</label><textarea id="memo" maxlength="200" placeholder="의료진 안내사항 등을 기록하세요."></textarea></div><div class="actions"><button class="btn primary" type="submit" id="saveBtn">일정 저장</button><button class="btn secondary" type="button" id="cancel" hidden>수정 취소</button></div></form><section class="card"><h2>오늘의 복용 일정</h2><div class="summary"><div class="stat">전체<b id="total">0</b></div><div class="stat">복용 완료<b id="complete">0</b></div></div><div id="list"></div></section></section><div class="notice"><b>주의:</b> 의약품과 영양제의 종류·용량·복용 중단은 반드시 의료진 또는 약사와 상담하세요. 이 프로그램은 복용 기록용이며 처방을 대신하지 않습니다.</div></main><script>
const KEY='maternalMedication_v1',$=x=>document.getElementById(x);let editId=null;const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch{return[]}},save=a=>localStorage.setItem(KEY,JSON.stringify(a)),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function reset(){editId=null;$('form').reset();$('formTitle').textContent='복용 일정 등록';$('saveBtn').textContent='일정 저장';$('cancel').hidden=true}function render(){const a=load().sort((x,y)=>x.time.localeCompare(y.time));$('total').textContent=a.length;$('complete').textContent=a.filter(x=>x.done).length;$('list').innerHTML=a.length?a.map(x=>`<article class="item ${x.done?'done':''}"><div class="top"><div><h3>${esc(x.name)}</h3><div class="meta">${esc(x.amount||'복용량 미입력')} · ${esc(x.frequency)}</div></div><span class="time">${esc(x.time)}</span></div>${x.memo?`<div class="memo">${esc(x.memo)}</div>`:''}<div class="actions" style="margin-top:11px"><button class="btn small ${x.done?'secondary':'primary'}" onclick="toggle('${x.id}')">${x.done?'완료 취소':'복용 완료'}</button><button class="btn small secondary" onclick="editItem('${x.id}')">수정</button><button class="btn small danger" onclick="removeItem('${x.id}')">삭제</button></div></article>`).join(''):'<div class="empty">등록된 복용 일정이 없습니다.</div>'}$('form').onsubmit=e=>{e.preventDefault();const n={id:editId||String(Date.now()),name:$('name').value.trim(),amount:$('amount').value.trim(),time:$('time').value,frequency:$('frequency').value,memo:$('memo').value.trim(),done:false};let a=load();if(editId){n.done=a.find(x=>x.id===editId)?.done||false;a=a.map(x=>x.id===editId?n:x)}else a.push(n);save(a);reset();render()};window.toggle=id=>{save(load().map(x=>x.id===id?{...x,done:!x.done}:x));render()};window.removeItem=id=>{if(confirm('삭제할까요?')){save(load().filter(x=>x.id!==id));render()}};window.editItem=id=>{const x=load().find(x=>x.id===id);editId=id;['name','amount','time','frequency','memo'].forEach(k=>$(k).value=x[k]);$('formTitle').textContent='복용 일정 수정';$('saveBtn').textContent='수정 저장';$('cancel').hidden=false};$('cancel').onclick=reset;render();
</script></body></html>
