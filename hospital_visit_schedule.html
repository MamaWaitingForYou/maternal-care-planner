<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>임산부 병원 방문 일정 관리</title>
  <style>
    :root{--primary:#b84d83;--soft:#fff1f7;--ink:#352d34;--muted:#746a72;--line:#eadde4;--ok:#287b62;--danger:#b42318}
    *{box-sizing:border-box}body{margin:0;background:#fff8fb;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
    .wrap{max-width:1000px;margin:auto;padding:28px 18px 60px}header{background:linear-gradient(135deg,#b84d83,#824c9d);color:white;border-radius:24px;padding:30px;box-shadow:0 14px 35px #8d41652b}
    h1{margin:0 0 8px;font-size:clamp(25px,5vw,38px)}header p{margin:0;opacity:.92}.grid{display:grid;grid-template-columns:370px 1fr;gap:20px;margin-top:20px}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 7px 22px #5d29470d}
    h2{font-size:20px;margin:0 0 18px}.field{margin-bottom:14px}label{display:block;font-weight:700;font-size:14px;margin-bottom:7px}input,select,textarea{width:100%;padding:12px 13px;border:1px solid #d8c8d0;border-radius:11px;font:inherit;background:white}textarea{min-height:82px;resize:vertical}input:focus,select:focus,textarea:focus{outline:3px solid #f3c9df;border-color:var(--primary)}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:12px 16px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--primary);color:white}.secondary{background:#f2eaf0;color:#533a49}.danger{background:#fff0ee;color:var(--danger)}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.stat{background:var(--soft);border-radius:14px;padding:14px;text-align:center}.stat b{display:block;font-size:23px;color:var(--primary)}
    .empty{padding:35px 10px;text-align:center;color:var(--muted)}.item{border:1px solid var(--line);border-radius:15px;padding:16px;margin-top:11px}.item.done{opacity:.62;background:#f6f6f6}.item.done h3{text-decoration:line-through}.item-top{display:flex;justify-content:space-between;gap:12px}.item h3{margin:0 0 6px;font-size:17px}.date{font-weight:800;color:var(--primary);white-space:nowrap}.meta,.memo{font-size:14px;color:var(--muted);margin-top:6px}.item .actions{margin-top:13px}.small{padding:8px 11px;font-size:13px}.notice{margin-top:18px;padding:15px;border-radius:14px;background:#fff5df;color:#72541b;font-size:13px;line-height:1.6}
    @media(max-width:760px){.grid{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.summary .stat:first-child{grid-column:1/-1}.item-top{display:block}.date{display:block;margin-top:8px}}
    @media print{header,.form-card,.item .actions,.notice{display:none}.grid{display:block}.card{border:0;box-shadow:none}.wrap{padding:0}}
  </style>
</head>
<body><main class="wrap">
  <header><h1>🤰 임산부 병원 방문 일정</h1><p>검진 일정을 등록하고 다음 방문일까지 남은 날짜를 확인하세요.</p></header>
  <section class="grid">
    <form class="card form-card" id="scheduleForm">
      <h2 id="formTitle">새 일정 등록</h2>
      <div class="row"><div class="field"><label for="date">방문 날짜 *</label><input id="date" type="date" required></div><div class="field"><label for="time">시간</label><input id="time" type="time"></div></div>
      <div class="field"><label for="hospital">병원명 *</label><input id="hospital" required maxlength="50" placeholder="예: 행복산부인과"></div>
      <div class="field"><label for="type">방문 목적</label><select id="type"><option>정기검진</option><option>초음파검사</option><option>혈액검사</option><option>임신성 당뇨검사</option><option>예방접종</option><option>기타</option></select></div>
      <div class="field"><label for="memo">준비사항·메모</label><textarea id="memo" maxlength="300" placeholder="검사 전 금식, 준비할 질문 등을 적으세요."></textarea></div>
      <div class="actions"><button class="btn primary" type="submit" id="saveBtn">일정 저장</button><button class="btn secondary" type="button" id="cancelBtn" hidden>수정 취소</button></div>
    </form>
    <section class="card"><h2>등록된 일정</h2><div class="summary"><div class="stat"><span>다음 방문</span><b id="nextVisit">-</b></div><div class="stat"><span>예정</span><b id="upcomingCount">0</b></div><div class="stat"><span>완료</span><b id="doneCount">0</b></div></div><div id="scheduleList"></div><div class="actions" style="margin-top:18px"><button class="btn secondary" onclick="window.print()">일정 인쇄</button></div></section>
  </section>
  <div class="notice"><b>안내:</b> 이 프로그램은 개인 일정 관리용이며 의료진의 진료를 대신하지 않습니다. 출혈, 심한 복통, 호흡곤란 등 긴급 증상이 있으면 일정과 관계없이 의료기관 또는 119에 즉시 연락하세요.</div>
</main>
<script>
  const KEY='pregnancyHospitalSchedules_v1'; let editingId=null;
  const $=id=>document.getElementById(id); const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch{return[]}}; const save=v=>localStorage.setItem(KEY,JSON.stringify(v));
  const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function localDay(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
  function dday(s){const now=new Date();now.setHours(0,0,0,0);return Math.round((localDay(s)-now)/86400000)}
  function resetForm(){editingId=null;$('scheduleForm').reset();$('formTitle').textContent='새 일정 등록';$('saveBtn').textContent='일정 저장';$('cancelBtn').hidden=true}
  function render(){const items=load().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));const nowItems=items.filter(x=>!x.done&&dday(x.date)>=0);$('upcomingCount').textContent=nowItems.length;$('doneCount').textContent=items.filter(x=>x.done).length;$('nextVisit').textContent=nowItems.length?(dday(nowItems[0].date)===0?'오늘':`D-${dday(nowItems[0].date)}`):'-';
    $('scheduleList').innerHTML=items.length?items.map(x=>{const n=dday(x.date);const label=n===0?'오늘':n>0?`D-${n}`:`${Math.abs(n)}일 전`;return `<article class="item ${x.done?'done':''}"><div class="item-top"><div><h3>${esc(x.hospital)}</h3><div class="meta">${esc(x.type)}${x.time?' · '+esc(x.time):''}</div></div><span class="date">${esc(x.date)} · ${label}</span></div>${x.memo?`<div class="memo">${esc(x.memo)}</div>`:''}<div class="actions"><button class="btn small ${x.done?'secondary':'primary'}" onclick="toggleDone('${x.id}')">${x.done?'완료 취소':'방문 완료'}</button><button class="btn small secondary" onclick="editItem('${x.id}')">수정</button><button class="btn small danger" onclick="removeItem('${x.id}')">삭제</button></div></article>`}).join(''):'<div class="empty">아직 등록된 일정이 없습니다.<br>왼쪽에서 첫 방문 일정을 등록해 보세요.</div>'}
  $('scheduleForm').addEventListener('submit',e=>{e.preventDefault();const item={id:editingId||String(Date.now()),date:$('date').value,time:$('time').value,hospital:$('hospital').value.trim(),type:$('type').value,memo:$('memo').value.trim(),done:false};let a=load();if(editingId){const old=a.find(x=>x.id===editingId);item.done=old?.done||false;a=a.map(x=>x.id===editingId?item:x)}else a.push(item);save(a);resetForm();render()});
  window.toggleDone=id=>{const a=load().map(x=>x.id===id?{...x,done:!x.done}:x);save(a);render()};
  window.removeItem=id=>{if(confirm('이 일정을 삭제할까요?')){save(load().filter(x=>x.id!==id));if(editingId===id)resetForm();render()}};
  window.editItem=id=>{const x=load().find(x=>x.id===id);if(!x)return;editingId=id;$('date').value=x.date;$('time').value=x.time;$('hospital').value=x.hospital;$('type').value=x.type;$('memo').value=x.memo;$('formTitle').textContent='일정 수정';$('saveBtn').textContent='수정 저장';$('cancelBtn').hidden=false;scrollTo({top:0,behavior:'smooth'})};
  $('cancelBtn').onclick=resetForm; render();
</script></body></html>
