<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>출산·육아 예상비용 계산기</title><style>
:root{--p:#d27a52;--bg:#fff9f4;--line:#efdfd3;--muted:#746b65}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#3a332f;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:930px;margin:auto;padding:26px 16px 60px}header{background:linear-gradient(135deg,#da8056,#bc6685);color:#fff;padding:28px;border-radius:22px}h1{margin:0 0 8px;font-size:clamp(25px,5vw,37px)}header p{margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:21px;box-shadow:0 8px 22px #895e4212}h2{margin:0 0 16px;font-size:20px}.field{margin-bottom:12px}label{display:block;font-size:14px;font-weight:800;margin-bottom:6px}input{width:100%;border:1px solid #dfcbbd;border-radius:10px;padding:11px;font:inherit;text-align:right}.input-wrap{position:relative}.input-wrap span{position:absolute;right:13px;top:11px;color:#80736b}.input-wrap input{padding-right:34px}.btn{border:0;border-radius:10px;padding:12px 15px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#f5eae3;color:#6b4b3a}.actions{display:flex;gap:8px}.result{background:#fff2e8;border-radius:16px;padding:18px;margin-bottom:12px}.result span{color:var(--muted)}.result b{display:block;color:var(--p);font-size:29px;margin-top:6px}.row-result{display:flex;justify-content:space-between;padding:12px 3px;border-bottom:1px solid var(--line)}.good{color:#237157!important}.over{color:#b32920!important}.notice{font-size:13px;line-height:1.6;color:var(--muted);margin-top:18px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><header><h1>🧸 출산·육아 예상비용 계산기</h1><p>항목별 예상비용을 더하고 준비한 예산과 비교해 보세요.</p></header><section class="grid"><form class="card" id="form"><h2>예상비용 입력</h2><div class="field"><label for="hospital">병원·분만 비용</label><div class="input-wrap"><input class="money" id="hospital" type="number" min="0" value="0"><span>원</span></div></div><div class="field"><label for="care">산후조리원 비용</label><div class="input-wrap"><input class="money" id="care" type="number" min="0" value="0"><span>원</span></div></div><div class="field"><label for="birth">출산 준비용품</label><div class="input-wrap"><input class="money" id="birth" type="number" min="0" value="0"><span>원</span></div></div><div class="field"><label for="baby">아기용품</label><div class="input-wrap"><input class="money" id="baby" type="number" min="0" value="0"><span>원</span></div></div><div class="field"><label for="other">기타 비용</label><div class="input-wrap"><input class="money" id="other" type="number" min="0" value="0"><span>원</span></div></div><div class="field"><label for="budget">준비한 전체 예산</label><div class="input-wrap"><input class="money" id="budget" type="number" min="0" value="0"><span>원</span></div></div><div class="actions"><button class="btn primary" type="submit">비용 계산하기</button><button class="btn secondary" type="button" id="reset">초기화</button></div></form><section class="card"><h2>계산 결과</h2><div class="result"><span>총 예상비용</span><b id="total">0원</b></div><div class="result"><span id="differenceLabel">예산 차액</span><b id="difference">0원</b></div><div id="breakdown"></div></section></section><p class="notice">금액은 계획을 돕기 위한 예상값입니다. 실제 비용과 정부·지자체 지원금은 의료기관과 관련 기관에서 확인하세요. 입력 금액은 현재 브라우저에 자동 저장됩니다.</p></main><script>
const KEY='birthCost_v1',$=x=>document.getElementById(x),ids=['hospital','care','birth','baby','other','budget'],labels={hospital:'병원·분만',care:'산후조리원',birth:'출산 준비용품',baby:'아기용품',other:'기타'};const won=n=>Number(n).toLocaleString('ko-KR')+'원';function calculate(){const v=Object.fromEntries(ids.map(id=>[id,Math.max(0,Number($(id).value)||0)]));localStorage.setItem(KEY,JSON.stringify(v));const total=['hospital','care','birth','baby','other'].reduce((s,id)=>s+v[id],0),diff=v.budget-total;$('total').textContent=won(total);$('differenceLabel').textContent=diff>=0?'남은 예산':'초과 예상금액';$('difference').textContent=won(Math.abs(diff));$('difference').className=diff>=0?'good':'over';$('breakdown').innerHTML=Object.keys(labels).map(id=>`<div class="row-result"><span>${labels[id]}</span><b>${won(v[id])}</b></div>`).join('')}$('form').onsubmit=e=>{e.preventDefault();calculate()};document.querySelectorAll('.money').forEach(x=>x.oninput=calculate);$('reset').onclick=()=>{ids.forEach(id=>$(id).value=0);localStorage.removeItem(KEY);calculate()};try{const v=JSON.parse(localStorage.getItem(KEY));if(v)ids.forEach(id=>$(id).value=v[id]||0)}catch{}calculate();
</script></body></html>
